server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # the 36 MB DuckDB engine compresses to ~8 MB
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/javascript text/css application/json image/svg+xml application/octet-stream;

    types {
        application/wasm wasm;
        text/javascript mjs;
    }

    # fingerprinted build assets never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /data/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
